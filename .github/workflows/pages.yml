# Tests and publishes the app to GitHub Pages. This workflow never changes the code:
# it has read-only access to the repository.
# - On every push to main.
# - Every Monday about 5:15 am Perth time (Sunday 21:13 UTC): refreshes the clubs' results from
#   Sporthive (tools/sporthive-sync.js) and publishes them. The refreshed results are kept in the
#   workflow cache, not committed, so only the owner ever changes the repository.
# - On demand from the Actions tab ("Run workflow"), which also refreshes the results.
# - On pull requests (e.g. Claude's proposed updates): tests and builds only, never publishes.
#   Changes reach the live site only when the owner merges the pull request into main.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '13 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pull requests: check the proposed change (no access to publish)
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore the latest club results
        uses: actions/cache/restore@v6
        with:
          path: .sporthive-cache
          key: sporthive-history-${{ github.run_id }}
          restore-keys: sporthive-history-
      - name: Use the newer club results (cache or repository)
        run: node tools/pick-history.js

      - name: Refresh club results from Sporthive
        if: github.event_name != 'push'
        run: node tools/sporthive-sync.js

      - run: npm test
      - run: npm run build

      - name: Keep the club results for next time
        run: mkdir -p .sporthive-cache && cp js/history-data.js .sporthive-cache/history-data.js
      - uses: actions/cache/save@v6
        with:
          path: .sporthive-cache
          key: sporthive-history-${{ github.run_id }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
